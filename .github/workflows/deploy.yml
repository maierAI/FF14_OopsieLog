name: Deploy FF14 OopsieLog

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:run

      - name: Run workflow API test
        run: npm run test:workflow:api

      - name: Build
        env:
          VITE_STORAGE_MODE: api
        run: npm run build

  deploy-dev:
    name: Deploy to development
    runs-on: ubuntu-latest
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      github.event_name == 'workflow_dispatch'
    environment: development
    concurrency:
      group: ff14-oopsie-development
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-deploy.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install deploy dependencies
        run: python -m pip install -r requirements-deploy.txt

      - name: Prepare deploy credentials
        env:
          DEPLOY_HOST_SECRET: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PASSWORD_SECRET: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SSH_KEY_SECRET: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST_SECRET" ]; then
            echo "::error::Missing required secret DEPLOY_HOST"
            exit 1
          fi

          if [ -z "$DEPLOY_PASSWORD_SECRET" ] && [ -z "$DEPLOY_SSH_KEY_SECRET" ]; then
            echo "::error::Set either DEPLOY_PASSWORD or DEPLOY_SSH_KEY"
            exit 1
          fi

          if [ -n "$DEPLOY_PASSWORD_SECRET" ] && [ -n "$DEPLOY_SSH_KEY_SECRET" ]; then
            echo "::error::Set only one of DEPLOY_PASSWORD or DEPLOY_SSH_KEY"
            exit 1
          fi

          if [ -n "$DEPLOY_SSH_KEY_SECRET" ]; then
            install -m 700 -d "$HOME/.ssh"
            printf '%s\n' "$DEPLOY_SSH_KEY_SECRET" > "$HOME/.ssh/deploy_key"
            chmod 600 "$HOME/.ssh/deploy_key"
            echo "DEPLOY_KEY_FILE=$HOME/.ssh/deploy_key" >> "$GITHUB_ENV"
          fi

      - name: Validate deployment variables
        env:
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          DEPLOY_SERVICE_NAME: ${{ vars.DEPLOY_SERVICE_NAME }}
          DEPLOY_APP_PORT: ${{ vars.DEPLOY_APP_PORT }}
          DEPLOY_APP_HOST: ${{ vars.DEPLOY_APP_HOST }}
        run: |
          for name in DEPLOY_APP_DIR DEPLOY_SERVICE_NAME DEPLOY_APP_PORT DEPLOY_APP_HOST; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required Environment Variable $name"
              exit 1
            fi
          done

      - name: Deploy development release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          DEPLOY_SERVICE_NAME: ${{ vars.DEPLOY_SERVICE_NAME }}
          DEPLOY_NODE_VERSION: ${{ vars.DEPLOY_NODE_VERSION }}
          DEPLOY_APP_PORT: ${{ vars.DEPLOY_APP_PORT }}
          DEPLOY_APP_HOST: ${{ vars.DEPLOY_APP_HOST }}
        run: python scripts/deploy.py
